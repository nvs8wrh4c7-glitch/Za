<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Coming Down" />
<meta name="theme-color" content="#f5f5f4" />
<title>Coming Down — taper tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23047857' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7 20h10'/%3E%3Cpath d='M10 20c5.5-2.5.8-6.4 3-10'/%3E%3Cpath d='M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7C14 11 14 8 12.6 6.4 11.5 5.1 9.7 4.4 8.2 4 7.6 5.6 7.8 7.5 9.5 9.4'/%3E%3Cpath d='M14.1 6a7 7 0 0 0-1.1-4C11.1.7 9.5 0 8 0c.4 1.7.3 3.5 1 5'/%3E%3C/svg%3E" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap');

  :root{
    --paper:#f5f5f4; --card:#fff; --line:#e7e5e4; --line2:#d6d3d1;
    --ink:#292524; --ink2:#78716c; --faint:#a8a29e;
    --moss:#047857; --moss2:#059669; --moss-bg:#ecfdf5; --moss-bd:#a7f3d0;
    --amber:#d97706; --amber-bg:#fffbeb; --amber-bd:#fde68a; --amber-ink:#92400e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .ff{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-feature-settings:'ss01'}
  .wrap{max-width:30rem;margin:0 auto;padding:1.75rem 1.25rem 2.5rem}

  h1{margin:0}
  .eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
  .muted{color:var(--ink2)} .faint{color:var(--faint)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.25rem;box-shadow:0 1px 2px rgba(0,0,0,.03);margin-bottom:1rem}

  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,input:focus-visible{outline:2px solid var(--moss2);outline-offset:2px}
  .round{width:3rem;height:3rem;border-radius:999px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:1.4rem}
  .round.lg{width:3.5rem;height:3.5rem;font-size:1.6rem}
  .round:active{background:#fafaf9}
  .primary{width:100%;height:3.5rem;border-radius:1rem;background:#1c1917;color:#fff;font-size:1.05rem;font-weight:500}
  .primary:active{background:#292524}
  .primary.sm{height:3rem;font-size:1rem}

  input[type=text],input[type=tel]{width:100%;border:1px solid var(--line2);border-radius:.75rem;padding:.55rem .7rem;font:inherit;background:#fff;color:var(--ink)}
  .field{display:flex;align-items:center;border:1px solid var(--line2);border-radius:.75rem;padding:0 .7rem}
  .field span{color:var(--faint);margin-right:.25rem}
  .field input{border:none;outline:none;padding:.55rem 0;width:100%;font:inherit;background:transparent}

  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
  .opt{height:3rem;border-radius:.75rem;border:1px solid var(--line2);color:var(--ink2);font-weight:500}
  .opt.on{background:var(--moss2);border-color:var(--moss2);color:#fff}
  .opt:active{background:#fafaf9}
  .opt.on:active{background:var(--moss)}

  .row{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
  .seg{display:flex;gap:.5rem;flex:1}
  .seg button{flex:1;height:2.25rem;border-radius:.6rem;border:1px solid var(--line);color:var(--ink2);font-size:.9rem}
  .seg button.on{background:var(--moss2);border-color:var(--moss2);color:#fff}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem}
  .stat .big{font-size:1.85rem;line-height:1}
  .stat .big.accent{color:var(--moss)}
  .stat .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-top:.4rem}

  .chip{display:inline-flex;align-items:center;gap:.25rem;background:#fafaf9;border:1px solid var(--line);border-radius:.5rem;padding:.35rem .55rem;font-size:.85rem}
  .chip .v{font-size:1rem}
  .chip.free{background:var(--moss-bg);border-color:var(--moss-bd);color:var(--moss)}

  .note{background:var(--amber-bg);border:1px solid var(--amber-bd);color:var(--amber-ink);border-radius:.75rem;padding:.6rem .7rem;font-size:.9rem;margin-top:.75rem}

  .legend{display:flex;gap:1rem;font-size:.72rem;color:var(--faint);padding:.25rem .25rem 0}
  .legend i{display:inline-block;width:.85rem;height:0;border-top:2px solid;margin-right:.35rem;vertical-align:middle}

  .collapse-h{width:100%;display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;text-align:left;font-weight:500;color:var(--ink2)}
  .chev{transition:transform .18s ease;color:var(--faint)}
  .chev.open{transform:rotate(180deg)}

  .sheet{position:fixed;inset:0;background:rgba(28,25,23,.4);display:flex;align-items:flex-end;justify-content:center;padding:1.25rem;z-index:50}
  .sheet .box{background:#fff;border-radius:1rem;padding:1.5rem;max-width:24rem;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.2)}

  .footnote{text-align:center;font-size:.72rem;color:var(--faint);margin-top:1.25rem}

  @media (min-width:480px){.sheet{align-items:center}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================ state + storage ============================ */
var KEY = "weed-taper-data";
var state = { config: null, logs: {} };
var ui = {};
var memoryOnly = false; // true if localStorage is blocked (e.g. inside an iframe)

function loadState(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ memoryOnly = true; }
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ memoryOnly = true; }
}

/* ============================ date helpers ============================ */
function pad(n){ return String(n).padStart(2,"0"); }
function dKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function kDate(k){ var p=k.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function todayKey(){ return dKey(new Date()); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function diffDays(a,b){ return Math.round((kDate(b)-kDate(a))/86400000); }
function fmtDate(d){ return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* ============================ plan maths ============================ */
function weeklyTargets(baseline,weeks){
  var t=[]; for(var w=1;w<=weeks;w++){ t.push(Math.max(0,Math.round(baseline*(1-w/weeks)))); } return t;
}
function targetForIdx(i,targets,weeks,planLen){
  if(i>=planLen) return 0;
  return targets[clamp(Math.floor(i/7),0,weeks-1)];
}

/* ============================ chart (hand-drawn SVG) ============================ */
function chartSVG(){
  var c=state.config, logs=state.logs;
  var targets=weeklyTargets(c.baseline,c.weeks);
  var planLen=c.weeks*7, tk=todayKey();
  var di=Math.max(0,diffDays(c.startDate,tk));
  var planOver=di>=planLen;
  var keys=Object.keys(logs);
  var lastLogged=keys.reduce(function(m,k){return Math.max(m,diffDays(c.startDate,k));},0);
  var span=Math.max(planLen, di+1, lastLogged+1);

  var W=600,H=220,pl=30,pr=10,pt=12,pb=22;
  var plotW=W-pl-pr, plotH=H-pt-pb, xmax=Math.max(1,span-1);
  var ymax=c.baseline; keys.forEach(function(k){ ymax=Math.max(ymax,logs[k].amount||0); }); ymax=Math.max(2,ymax)+1;
  var X=function(i){ return pl+(i/xmax)*plotW; };
  var Y=function(v){ return pt+(1-v/ymax)*plotH; };
  var y0=Y(0);

  var tgt=[]; for(var i=0;i<span;i++){ tgt.push([X(i),Y(targetForIdx(i,targets,c.weeks,planLen))]); }
  var area="M "+tgt[0][0].toFixed(1)+" "+y0.toFixed(1)+" ";
  tgt.forEach(function(p){ area+="L "+p[0].toFixed(1)+" "+p[1].toFixed(1)+" "; });
  area+="L "+tgt[tgt.length-1][0].toFixed(1)+" "+y0.toFixed(1)+" Z";
  var line="M "+tgt[0][0].toFixed(1)+" "+tgt[0][1].toFixed(1)+" ";
  tgt.forEach(function(p){ line+="L "+p[0].toFixed(1)+" "+p[1].toFixed(1)+" "; });

  var acts=keys.map(function(k){return {i:diffDays(c.startDate,k),v:logs[k].amount||0};})
               .filter(function(a){return a.i>=0&&a.i<span;}).sort(function(a,b){return a.i-b.i;});
  var actLine="", dots="";
  acts.forEach(function(a,idx){
    var x=X(a.i),y=Y(a.v);
    actLine+=(idx===0?"M ":"L ")+x.toFixed(1)+" "+y.toFixed(1)+" ";
    dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.5" fill="#44403c"/>';
  });

  var today = !planOver ? '<line x1="'+X(di).toFixed(1)+'" y1="'+pt+'" x2="'+X(di).toFixed(1)+'" y2="'+y0.toFixed(1)+'" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 3"/>' : "";
  var grid='<line x1="'+pl+'" y1="'+y0.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y0.toFixed(1)+'" stroke="#e7e5e4"/>';
  var ylab='<text x="'+(pl-6)+'" y="'+(y0+3).toFixed(1)+'" font-size="11" fill="#a8a29e" text-anchor="end">0</text>'+
           '<text x="'+(pl-6)+'" y="'+(Y(c.baseline)+3).toFixed(1)+'" font-size="11" fill="#a8a29e" text-anchor="end">'+c.baseline+'</text>';
  var xlab=""; for(var w=0;w<c.weeks;w++){ var ix=w*7; if(ix<=xmax){ xlab+='<text x="'+X(ix).toFixed(1)+'" y="'+(H-6)+'" font-size="11" fill="#a8a29e" text-anchor="middle">W'+(w+1)+'</text>'; } }

  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your taper plan and logged days">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#059669" stop-opacity="0.2"/>'+
    '<stop offset="100%" stop-color="#059669" stop-opacity="0.02"/></linearGradient></defs>'+
    grid+
    '<path d="'+area+'" fill="url(#g)"/>'+
    '<path d="'+line+'" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round"/>'+
    today+
    '<path d="'+actLine+'" fill="none" stroke="#44403c" stroke-width="2" stroke-linejoin="round"/>'+
    dots+ylab+xlab+'</svg>';
}

/* ============================ icons ============================ */
var sproutSVG='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7C14 11 14 8 12.6 6.4 11.5 5.1 9.7 4.4 8.2 4 7.6 5.6 7.8 7.5 9.5 9.4Z"/><path d="M14.1 6a7 7 0 0 0-1.1-4C11.1.7 9.5 0 8 0c.4 1.7.3 3.5 1 5"/></svg>';
var calSVG='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
var resetSVG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';
var chevSVG='<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
var checkSVG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

/* ============================ setup screen ============================ */
function renderSetup(){
  var s=ui.setup, t=weeklyTargets(s.baseline,s.weeks);
  var chips=t.map(function(v,i){ return '<div class="chip"><span class="faint">W'+(i+1)+'</span><span class="v ff">'+v+'</span></div>'; }).join("");
  chips+='<div class="chip free"><span class="v ff">0</span> · free</div>';
  var weekBtns=[2,3,4,6,8].map(function(w){ return '<button class="opt'+(s.weeks===w?' on':'')+'" data-action="weeks" data-w="'+w+'">'+w+'w</button>'; }).join("");

  return '<div class="wrap">'+
    '<div class="row" style="justify-content:flex-start;gap:.5rem;margin-bottom:.4rem">'+sproutSVG+'<span class="eyebrow">Set your path</span></div>'+
    '<h1 class="ff" style="font-size:2.4rem;line-height:1.1;margin-bottom:.4rem">Coming down.</h1>'+
    '<p class="muted" style="margin:0 0 1.5rem">A gentle way down to zero. Set where you\'re starting and how long to take — you can change it later.</p>'+

    '<div class="card">'+
      '<label style="font-weight:500;font-size:.92rem">A typical day right now</label>'+
      '<p class="faint" style="font-size:.85rem;margin:.25rem 0 1rem">How many you usually have. A "'+esc(s.unit||"session")+'" is whatever you count as one.</p>'+
      '<div class="row" style="justify-content:center;gap:1.5rem">'+
        '<button class="round" data-action="b-dec">&minus;</button>'+
        '<div style="text-align:center;width:5rem"><div class="ff" style="font-size:3rem;line-height:1">'+s.baseline+'</div><div class="faint" style="font-size:.85rem;margin-top:.25rem">a day</div></div>'+
        '<button class="round" data-action="b-inc">+</button>'+
      '</div>'+
      '<div style="margin-top:1.25rem"><label class="muted" style="font-size:.85rem;display:block;margin-bottom:.3rem">What do you call one?</label>'+
      '<input id="unit" type="text" placeholder="session, joint, bowl…" value="'+esc(s.unit)+'" /></div>'+
    '</div>'+

    '<div class="card">'+
      '<label style="font-weight:500;font-size:.92rem">Take it down over</label>'+
      '<p class="faint" style="font-size:.85rem;margin:.25rem 0 1rem">Longer is gentler on sleep and mood. Shorter gets you there faster.</p>'+
      '<div class="grid5">'+weekBtns+'</div>'+
    '</div>'+

    '<div class="card">'+
      '<label style="font-weight:500;font-size:.92rem">Cost per '+esc(s.unit||"session")+' <span class="faint" style="font-weight:400">(optional)</span></label>'+
      '<p class="faint" style="font-size:.85rem;margin:.25rem 0 .75rem">Add this and it\'ll show what you\'re saving as you cut down.</p>'+
      '<div class="field"><span>€</span><input id="cost" type="tel" inputmode="decimal" placeholder="0" value="'+esc(s.cost)+'" /></div>'+
    '</div>'+

    '<button class="primary" data-action="start">Start my plan</button>'+

    '<div style="margin-top:1.5rem"><div class="eyebrow" style="margin-bottom:.5rem">The plan, week by week</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:.5rem">'+chips+'</div>'+
    '<p class="faint" style="font-size:.75rem;margin:.5rem 0 0">'+esc(s.unit||"session")+'s per day.</p></div>'+
  '</div>';
}

/* ============================ dashboard ============================ */
function seg(name,val,opts){
  return '<div class="seg">'+opts.map(function(o,i){
    return '<button data-action="set-'+name+'" data-v="'+(i+1)+'" class="'+(val===i+1?'on':'')+'">'+o+'</button>';
  }).join("")+'</div>';
}

function renderDashboard(){
  var c=state.config, logs=state.logs;
  var targets=weeklyTargets(c.baseline,c.weeks);
  var planLen=c.weeks*7, tk=todayKey();
  var di=Math.max(0,diffDays(c.startDate,tk));
  var planOver=di>=planLen;
  var dayNum=di+1, weekNum=clamp(Math.floor(di/7)+1,1,c.weeks);
  var todayTarget=planOver?0:targets[clamp(Math.floor(di/7),0,c.weeks-1)];
  var quit=addDays(kDate(c.startDate),planLen);

  var keys=Object.keys(logs);
  var avoided=keys.reduce(function(s,k){return s+Math.max(0,c.baseline-(logs[k].amount||0));},0);
  var onTarget=keys.filter(function(k){return (logs[k].amount||0)<=targetForIdx(diffDays(c.startDate,k),targets,c.weeks,planLen);}).length;
  var saved=avoided*(c.cost||0);

  var heroMsg;
  if(planOver){ heroMsg='<p style="margin:0;color:var(--moss)">Past the plan — this is about staying at zero now. You did the hard part.</p>'; }
  else if(todayTarget===0){ heroMsg='<p style="margin:0;color:var(--moss);font-weight:500">Final stretch — aim for zero today.</p>'; }
  else { heroMsg='<p style="margin:0" class="muted">This week, aim for <span class="ff" style="color:var(--moss);font-size:1.15rem">'+todayTarget+'</span> '+(todayTarget===1?esc(c.unit):esc(c.unit)+"s")+' a day.</p>'; }

  var amount=ui.amount, underT=amount<=todayTarget;

  var checkin = ui.openCheckin ? (
    '<div style="margin-top:.75rem;display:flex;flex-direction:column;gap:.75rem">'+
      '<div class="row"><span class="muted" style="font-size:.88rem;width:5rem">Sleep</span>'+seg("sleep",ui.sleep,["Rough","OK","Good"])+'</div>'+
      '<div class="row"><span class="muted" style="font-size:.88rem;width:5rem">Mood</span>'+seg("mood",ui.mood,["Low","OK","Good"])+'</div>'+
      '<div class="row"><span class="muted" style="font-size:.88rem;width:5rem">Cravings</span>'+seg("craving",ui.craving,["Low","Some","High"])+'</div>'+
      (ui.craving===3?'<p class="note">Cravings spike early and usually settle within a couple of weeks. Riding this one out is the work — it passes.</p>':'')+
    '</div>') : '';

  var expect = ui.openExpect ? (
    '<div style="padding:0 1.25rem 1.25rem;border-top:1px solid var(--line);margin-top:0">'+
      '<p class="muted" style="font-size:.9rem;margin:.75rem 0 .5rem">For regular use, the rough sleep, vivid dreams, irritability and low appetite tend to <b style="color:var(--ink)">peak around days 2–7</b>, then ease over the next two to three weeks.</p>'+
      '<p class="muted" style="font-size:.9rem;margin:0 0 .5rem">Cutting down gradually softens that curve. Logging how you feel here isn\'t busywork — watching it fade is the proof it\'s temporary.</p>'+
      '<p class="faint" style="font-size:.85rem;margin:0">An off day isn\'t a failure; it\'s a data point. Note it and keep going.</p>'+
    '</div>') : '';

  var fourth = (c.cost>0)
    ? '<div class="card stat" style="margin:0"><div class="big ff accent">€'+Math.round(saved)+'</div><div class="lbl">Saved</div></div>'
    : '<div class="card stat" style="margin:0"><div class="big ff">'+todayTarget+'</div><div class="lbl">This week</div><div class="faint" style="font-size:.7rem">target/day</div></div>';

  return '<div class="wrap">'+
    '<div class="row" style="margin-bottom:1rem">'+
      '<div class="row" style="justify-content:flex-start;gap:.5rem">'+sproutSVG+'<span class="ff" style="font-size:1.25rem">Coming down</span></div>'+
      '<button data-action="reset-open" aria-label="Start over">'+resetSVG+'</button>'+
    '</div>'+

    /* hero */
    '<div class="card">'+
      '<div class="row" style="align-items:flex-end">'+
        '<div><div class="ff" style="font-size:3.4rem;line-height:1">'+(planOver?"✓":"Day "+dayNum)+'</div>'+
        '<div class="faint" style="font-size:.85rem;margin-top:.5rem">Week '+weekNum+' of '+c.weeks+'</div></div>'+
        '<div style="text-align:right"><div class="faint" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25rem">Zero day</div>'+
        '<div class="row" style="justify-content:flex-end;gap:.3rem">'+calSVG+'<span class="ff" style="font-size:1.05rem">'+fmtDate(quit)+'</span></div></div>'+
      '</div>'+
      '<div style="margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--line)">'+heroMsg+'</div>'+
    '</div>'+

    /* chart */
    '<div class="card">'+
      '<div class="eyebrow" style="margin-bottom:.75rem">The way down</div>'+
      chartSVG()+
      '<div class="legend"><span><i style="border-color:#059669"></i>plan</span><span><i style="border-color:#44403c"></i>you</span>'+(planOver?"":'<span><i style="border-color:#d97706;border-top-style:dashed"></i>today</span>')+'</div>'+
    '</div>'+

    /* log today */
    '<div class="card">'+
      '<div class="row" style="margin-bottom:1rem"><span style="font-weight:500">Today</span><span class="faint" style="font-size:.9rem">target '+todayTarget+'</span></div>'+
      '<div class="row" style="justify-content:center;gap:1.5rem">'+
        '<button class="round lg" data-action="t-dec">&minus;</button>'+
        '<div style="text-align:center;width:6rem"><div class="ff" style="font-size:3.6rem;line-height:1;color:'+(underT?"var(--moss)":"var(--ink)")+'">'+amount+'</div></div>'+
        '<button class="round lg" data-action="t-inc">+</button>'+
      '</div>'+
      '<button data-action="checkin" style="margin-top:1.25rem;width:100%" class="row"><span class="muted" style="font-size:.9rem">How are you doing?</span>'+
        '<span class="'+(ui.openCheckin?"chev open":"chev")+'" style="color:var(--faint)">'+chevSVG.replace('class="chev"','')+'</span></button>'+
      checkin+
      '<button class="primary sm" data-action="save" style="margin-top:1.25rem;display:flex;align-items:center;justify-content:center;gap:.5rem">'+(ui.saved?checkSVG+' Saved':'Save today')+'</button>'+
    '</div>'+

    /* stats */
    '<div class="stats">'+
      '<div class="card stat" style="margin:0"><div class="big ff">'+keys.length+'</div><div class="lbl">Days logged</div></div>'+
      '<div class="card stat" style="margin:0"><div class="big ff">'+onTarget+'/'+keys.length+'</div><div class="lbl">On target</div></div>'+
      '<div class="card stat" style="margin:0"><div class="big ff accent">'+avoided+'</div><div class="lbl">'+esc(c.unit)+'s avoided</div></div>'+
      fourth+
    '</div>'+

    /* what to expect */
    '<div class="card" style="padding:0;overflow:hidden">'+
      '<button class="collapse-h" data-action="expect"><span>What to expect</span><span class="'+(ui.openExpect?"chev open":"chev")+'">'+chevSVG.replace('class="chev"','')+'</span></button>'+
      expect+
    '</div>'+

    '<div class="footnote">'+(memoryOnly
      ? "Heads up: this preview can\u2019t save. Download the file and open it in your browser."
      : "Saved on this device, in this browser. No account, no cloud.")+'</div>'+
  '</div>'+

  (ui.confirmReset ? (
    '<div class="sheet"><div class="box">'+
      '<h2 class="ff" style="font-size:1.6rem;margin:0 0 .5rem">Start over?</h2>'+
      '<p class="muted" style="margin:0 0 1.25rem">This clears your plan and every logged day. It can\'t be undone.</p>'+
      '<div style="display:flex;gap:.75rem">'+
        '<button class="opt" style="flex:1;height:3rem" data-action="reset-cancel">Keep going</button>'+
        '<button class="primary sm" style="flex:1" data-action="reset-confirm">Reset</button>'+
      '</div>'+
    '</div></div>') : '');
}

/* ============================ render + events ============================ */
function render(){
  var app=document.getElementById("app");
  app.innerHTML = (state.config ? renderDashboard() : renderSetup());
}

function enterDashboardUI(){
  var t=state.logs[todayKey()]||{};
  ui={ amount:t.amount||0, sleep:t.sleep||0, mood:t.mood||0, craving:t.craving||0,
       openCheckin:!(todayKey() in state.logs), openExpect:false, confirmReset:false, saved:false };
}
function enterSetupUI(){
  ui={ setup:{ baseline:3, weeks:4, unit:"session", cost:"" } };
}

document.addEventListener("input", function(e){
  if(!ui.setup) return;
  if(e.target.id==="unit") ui.setup.unit=e.target.value;
  if(e.target.id==="cost") ui.setup.cost=e.target.value;
});

document.addEventListener("click", function(e){
  var el=e.target.closest("[data-action]"); if(!el) return;
  var a=el.getAttribute("data-action");

  /* setup */
  if(a==="b-dec"){ ui.setup.baseline=Math.max(1,ui.setup.baseline-1); return render(); }
  if(a==="b-inc"){ ui.setup.baseline=Math.min(30,ui.setup.baseline+1); return render(); }
  if(a==="weeks"){ ui.setup.weeks=parseInt(el.getAttribute("data-w"),10); return render(); }
  if(a==="start"){
    var s=ui.setup;
    state={ config:{ baseline:s.baseline, weeks:s.weeks, unit:(s.unit||"session").trim()||"session",
                     cost:parseFloat(s.cost)||0, startDate:todayKey() }, logs:{} };
    persist(); enterDashboardUI(); return render();
  }

  /* dashboard */
  if(a==="t-dec"){ ui.amount=Math.max(0,ui.amount-1); ui.saved=false; return render(); }
  if(a==="t-inc"){ ui.amount=ui.amount+1; ui.saved=false; return render(); }
  if(a==="checkin"){ ui.openCheckin=!ui.openCheckin; return render(); }
  if(a==="expect"){ ui.openExpect=!ui.openExpect; return render(); }
  if(a==="set-sleep"){ var v=+el.getAttribute("data-v"); ui.sleep=(ui.sleep===v?0:v); return render(); }
  if(a==="set-mood"){ var v2=+el.getAttribute("data-v"); ui.mood=(ui.mood===v2?0:v2); return render(); }
  if(a==="set-craving"){ var v3=+el.getAttribute("data-v"); ui.craving=(ui.craving===v3?0:v3); return render(); }
  if(a==="save"){
    state.logs[todayKey()]={ amount:ui.amount, sleep:ui.sleep, mood:ui.mood, craving:ui.craving };
    persist(); ui.saved=true; render();
    setTimeout(function(){ ui.saved=false; render(); },1600);
    return;
  }
  if(a==="reset-open"){ ui.confirmReset=true; return render(); }
  if(a==="reset-cancel"){ ui.confirmReset=false; return render(); }
  if(a==="reset-confirm"){ state={ config:null, logs:{} }; persist(); enterSetupUI(); return render(); }
});

/* ============================ boot ============================ */
loadState();
if(state.config) enterDashboardUI(); else enterSetupUI();
render();
</script>
</body>
</html>
